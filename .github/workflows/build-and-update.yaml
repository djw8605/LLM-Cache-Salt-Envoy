name: Build and Update Kustomize Tag

on:
  push:
    branches:
      - main
    paths:
      - "extproc/**"
      - "deploy/**"
      - ".github/workflows/build-and-update.yaml"
  workflow_dispatch:

# Prevent concurrent runs on the same branch to avoid race conditions when
# committing the kustomize image-tag update back to the repo.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

# Required permissions:
#   contents:write  – to push the kustomize image-tag commit back to the repo
#   packages:write  – to push the container image to GHCR
#   id-token:write  – for OIDC token (if using keyless signing with cosign)
permissions:
  contents: write
  packages: write

env:
  # --- Container registry configuration ---
  # Default: GitHub Container Registry.  Override by setting these as
  # repository variables (Settings → Variables → Actions).
  REGISTRY: ghcr.io
  # Image name: ghcr.io/<owner>/<repo>/<image>.  GitHub lowercases the owner.
  IMAGE_NAME: ${{ github.repository_owner }}/cache-salt-extproc

jobs:
  build-push-update:
    name: Build, Push, and Update Tag
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------
      # Guard: skip this workflow if the commit was made by the CI bot
      # (the image-tag bump commit).  This prevents infinite loops.
      # The [skip ci] token in the commit message is the primary guard;
      # this step provides a secondary safeguard.
      # ------------------------------------------------------------------
      - name: Check for CI-skip commit
        id: skip_check
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if echo "${COMMIT_MSG}" | grep -qF "[skip ci]"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.skip_check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          # Use a deploy key or PAT with write access when the default
          # GITHUB_TOKEN cannot trigger downstream workflows on push.
          # Set repository secret DEPLOY_KEY or PAT_TOKEN if needed.
          # token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      # ------------------------------------------------------------------
      # Build and push the container image
      # ------------------------------------------------------------------
      - name: Set up Docker Buildx
        if: steps.skip_check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.skip_check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # GITHUB_TOKEN is sufficient for GHCR; no additional secret needed.
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.skip_check.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: extproc/cache-salt
          file: extproc/cache-salt/Dockerfile
          push: true
          # Tag with the full Git SHA for deterministic rollbacks, and also
          # update the `latest` tag for convenience.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------
      # Update the kustomize image tag in the prod overlay and push back
      # ------------------------------------------------------------------
      - name: Install kustomize
        if: steps.skip_check.outputs.skip != 'true'
        uses: imranismail/setup-kustomize@v2

      - name: Update prod overlay image tag
        if: steps.skip_check.outputs.skip != 'true'
        working-directory: deploy/overlays/prod
        run: |
          # kustomize edit set image resolves by the short name defined in
          # base/kustomization.yaml (`cache-salt-extproc`) and replaces it
          # with the full registry URL + new git SHA tag.
          kustomize edit set image \
            "cache-salt-extproc=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Commit and push kustomize change
        if: steps.skip_check.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/prod/kustomization.yaml
          # Exit cleanly if there is nothing to commit (e.g. rebuild of the
          # same SHA).
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(extproc): bump image to ${{ github.sha }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
