apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev overlay – smaller resource requests, single replica, debug logging.
resources:
  - ../../base

namespace: llm-cache-salt-dev

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cache-salt-extproc
        namespace: llm-cache-salt
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: cache-salt-extproc
                env:
                  - name: LOG_LEVEL
                    value: "DEBUG"
                resources:
                  requests:
                    cpu: "20m"
                    memory: "32Mi"
                  limits:
                    cpu: "200m"
                    memory: "64Mi"

# Image tag is kept at `latest` in dev; pin to a specific sha for testing.
images:
  - name: cache-salt-extproc
    newName: ghcr.io/OWNER/cache-salt-extproc
    newTag: latest
